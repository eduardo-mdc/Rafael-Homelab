# PersistentVolumeClaim — iscsi-zfs (democratic-csi, the default and only StorageClass)
# Use for app data that must survive pod restarts.
#
# ReadWriteOnce is the ONLY option. iSCSI is block storage, so a volume attaches to
# one node at a time — there is no ReadWriteMany in this cluster, and no CSI driver
# that offers it. An RWX claim will simply never bind.
#
# If several workloads need the same filesystem, they have to be containers in the
# same pod (pods share their volumes) — see deployments/nubiup for a worked example.
# The alternative is object storage: Garage runs in the `garage-host` namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-app-data
  namespace: my-namespace
  labels:
    app.kubernetes.io/name: my-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

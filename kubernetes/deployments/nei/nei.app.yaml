apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nei
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # argocd-image-updater is not installed in this cluster, so these are inert,
    # exactly as on portfolio, cladewright, palworld and nubiup. A new image is
    # rolled out by hand:
    #
    #   kubectl -n rafael-homelab rollout restart deploy/nei-api deploy/nei-web
    #
    # That is a complete deploy on its own: imagePullPolicy: Always re-pulls
    # :latest, and the api pod's bootstrap initContainer builds the database if
    # it is empty and does nothing if it is not. See README.md.
    argocd-image-updater.argoproj.io/image-list: api=hydrodog11/nei-api,web=hydrodog11/nei-web
    argocd-image-updater.argoproj.io/api.update-strategy: digest
    argocd-image-updater.argoproj.io/api.tag-filter: latest
    argocd-image-updater.argoproj.io/web.update-strategy: digest
    argocd-image-updater.argoproj.io/web.tag-filter: latest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: rafael-homelab
  source:
    repoURL: git@github.com:eduardo-mdc/Rafael-Homelab.git
    targetRevision: HEAD
    path: kubernetes/deployments/nei/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rafael-homelab
  syncPolicy:
    automated:
      # prune: true everywhere else in this repo. NOT here, and deliberately:
      # this namespace holds one evening that happens once and cannot be
      # replayed. A manifest deleted by accident should leave the database
      # standing until somebody decides otherwise.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

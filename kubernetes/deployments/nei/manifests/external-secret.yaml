# The two secrets the exhibit has. Create both in Bitwarden Secrets Manager
# before syncing this app, or the api pod will not start:
#
#   rafael-nei-db-password    → openssl rand -hex 24
#   rafael-nei-admin-password → openssl rand -hex 24, or leave the item EMPTY
#
# The admin panel exists only when ADMIN_PASSWORD is non-empty. It is never
# routed publicly: the tunnel and the gateway both point at the web Service, and
# nothing forwards /admin, so reaching it means `kubectl port-forward`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nei-db-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nei-db-secret
    creationPolicy: Owner
    template:
      data:
        # The role name is a LITERAL, not a secret: it has to equal
        # postgres-cluster.yaml's bootstrap owner, and it authenticates nothing.
        # CNPG requires exactly `username` / `password` on the bootstrap secret.
        username: "board"
        password: "{{ .password }}"
        # What the api and the bootstrap read. Assembled here so the password
        # appears in exactly one place; -rw is the CNPG read-write Service.
        DATABASE_URL: "postgresql://board:{{ .password }}@nei-postgres-rw.rafael-homelab.svc.cluster.local:5432/board"
  data:
    - secretKey: password
      remoteRef:
        key: rafael-nei-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nei-app-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nei-app-secret
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: rafael-nei-admin-password
---
# Garage credentials for the Postgres backup (postgres-cluster.yaml), from a key
# scoped to the porto-k8s-backup bucket rather than an admin key:
#   rafael-nei-backup-s3-key-id
#   rafael-nei-backup-s3-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nei-backup-s3-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nei-backup-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: rafael-nei-backup-s3-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: rafael-nei-backup-s3-secret

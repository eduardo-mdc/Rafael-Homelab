# Django and its Celery worker, as one pod with three containers.
#
# NOT the public site. That is a Next server in its own Deployment and its own
# image — see next-deployment.yaml. Django here serves /cms/, /staff/, /api/v2/
# and /documents/; gateway.yaml decides which of the two gets a given path.
#
# WHY ONE POD. Web, the Celery worker and the media server all need the same two
# filesystems (Wagtail media, and the document vault that web writes uploads to and
# the worker writes generated certificates to). This cluster is RWO-only —
# `iscsi-zfs` is the sole storage class and iSCSI cannot do ReadWriteMany — so the
# volumes cannot be shared between pods. Containers in one pod share its volumes, so
# this needs a single attachment, has no cross-node multi-attach to fail, and no pod
# affinity to get subtly wrong. It is also the same topology the app was written for:
# docker-compose.prod.yml runs these on one host sharing named volumes.
#
# CONSEQUENCE: one replica, and `Recreate` — the RWO volume cannot be attached to an
# old and a new pod at once, so deploys have a short gap (roughly 20-40s) rather than
# being seamless. That is the honest trade for a site of this size. Scaling past one
# replica requires moving media + vault to object storage first (Garage is already in
# the cluster) — see README.md.
#
# Static files are not here at all: collectstatic runs at image build and WhiteNoise
# middleware serves /static/ from inside the container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nubiup-media-nginx
  namespace: rafael-homelab
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;

      # Scoped to /media/ so a misrouted request cannot be used to walk the
      # filesystem. The vault is not mounted into this container at all.
      location /media/ {
        alias /app/media/;
        autoindex off;
        # Wagtail renditions are content-addressed — the filename changes when the
        # image does — so they are safe to cache hard.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nubiup-web
  namespace: rafael-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nubiup-web
  template:
    metadata:
      labels:
        app: nubiup-web
      annotations:
        # BUMP THIS whenever configmap.yaml or an ExternalSecret this pod reads
        # changes. envFrom is evaluated once, when the container starts, so an
        # Argo sync that updates the ConfigMap changes NOTHING in a running pod —
        # the new value sits in the cluster, unread, and the symptom is a fix that
        # "did not work".
        #
        # That is not hypothetical: widening DJANGO_ALLOWED_HOSTS to admit the
        # in-cluster Service name left /en/ at 502 until the pod was recreated.
        # Touching this annotation changes the pod template, which is what makes
        # Argo roll the pod and reread the environment.
        #
        # Safe for this Deployment specifically because the strategy is Recreate:
        # the RWO media and vault volumes cannot be held by two pods at once.
        nubiup.io/env-revision: "2"
    spec:
      # The image runs as appuser (uid/gid 1000) and the CSI mounts volumes
      # root-owned, so without fsGroup the media and vault volumes are effectively
      # read-only and the first upload fails with EACCES. This replaces compose's
      # init_permissions chown service.
      # hydrodog11/biohub-up is not anonymously pullable, unlike the other images
      # in this cluster. The source repo (nubiup/website_nubiup) is private, and the
      # image contains the whole source tree, so it stays credentialed.
      #
      # Docker Hub is also in an odd state for this repo: the registry serves the
      # image with credentials, but Hub never created a repository *record* for it —
      # it 404s in the Hub API and does not appear in the account's repository list,
      # which means its visibility cannot be flipped through the UI or API. A pull
      # secret sidesteps that entirely.
      #
      # The secret is currently created out-of-band (see README.md, "Image pull
      # credentials") rather than from Bitwarden, so it survives a namespace
      # recreation only if recreated. Moving it to an ExternalSecret is the follow-up.
      imagePullSecrets:
        - name: nubiup-dockerhub
      securityContext:
        fsGroup: 1000
      # Container hardening. The images ALREADY run as uid 1000 (appuser in the
      # Django image, the base image's `node` in the Next one) — this only makes
      # that a property the kubelet enforces rather than one the Dockerfile
      # happens to have. readOnlyRootFilesystem is deliberately NOT set on the
      # Django containers: WeasyPrint and fontconfig write to $HOME on every
      # certificate render, which is why the image creates /home/appuser at all.
      # Doing it properly means emptyDirs on /home/appuser and /tmp, and wants a
      # test run rather than a blind change.
      initContainers:
        # Schema + seed, before anything serves traffic.
        #
        # An initContainer rather than an Argo PreSync hook, because of how this
        # cluster actually ships: argocd-image-updater is not installed, so a new
        # image is picked up by `kubectl rollout restart` (imagePullPolicy: Always
        # on a :latest tag), NOT by an Argo sync. A PreSync hook only fires on a
        # sync — i.e. when a manifest changes in git — so a restart-driven deploy
        # would start new code against an un-migrated schema. Here the ordering is
        # structural: this must exit 0 before the app containers start, so
        # `rollout restart` is a complete deploy on its own.
        #
        # No migration race to worry about: one replica, Recreate strategy, so
        # exactly one of these ever runs at a time.
        #
        # Both commands are idempotent — migrate is a no-op once applied, and
        # create_initial_pages skips pages that exist. It also calls setup_groups
        # itself, which is why the five staff groups aren't seeded separately.
        - name: migrate
          image: hydrodog11/biohub-up:latest
          imagePullPolicy: Always
          command:
            - sh
            - -lc
            - |
              set -e
              python manage.py migrate --noinput
              python manage.py create_initial_pages
          envFrom:
            - configMapRef:
                name: nubiup-env
            - secretRef:
                name: nubiup-app-secret
            - secretRef:
                name: nubiup-db-secret
            # AFTER the ConfigMap, deliberately: later envFrom entries win, so a
            # key that ever reappears in the ConfigMap cannot shadow the
            # credentialed URL. Carries the four redis:// URLs.
            # The migrate initContainer needs Redis (create_initial_pages warms
            # the cache) but not Drive — the sync is a Celery task, not part of
            # startup.
            - secretRef:
                name: nubiup-redis-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        # ── Django / ASGI ──────────────────────────────────────────────────────
        # Daphne rather than a WSGI server: the staff SPA's notification websocket
        # runs through Channels in this same process (apps/comms/consumers.py).
        - name: web
          image: hydrodog11/biohub-up:latest
          imagePullPolicy: Always
          # Image CMD: daphne -b $APP_HOST -p $APP_PORT config.asgi:application
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nubiup-env
            - secretRef:
                name: nubiup-app-secret
            - secretRef:
                name: nubiup-db-secret
            # AFTER the ConfigMap, deliberately: later envFrom entries win, so a
            # key that ever reappears in the ConfigMap cannot shadow the
            # credentialed URL. Carries the four redis:// URLs.
            - secretRef:
                name: nubiup-redis-secret
            # OPTIONAL, unlike every other secretRef here: there is no Google
            # service account yet, so nubiup-drive-secret does not exist and the
            # ExternalSecret that would create it is commented out. Without
            # `optional: true` the kubelet refuses to build the container and the
            # pod sits in CreateContainerConfigError — a missing nice-to-have
            # would take the whole site down.
            #
            # Nothing is scheduled against it: `sync_drive_resources` is a
            # management command run by hand, so an absent variable costs an empty
            # Resources page and nothing else. To wire Drive up later, with the
            # site running: create rafael-nubiup-drive-service-account-b64 in
            # Bitwarden, uncomment the ExternalSecret in external-secret.yaml, let
            # Argo sync, then `rollout restart deploy/nubiup-web deploy/nubiup-worker`
            # — envFrom is read once at container start. No edit here.
            - secretRef:
                name: nubiup-drive-secret
                optional: true
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: vault
              mountPath: /app/vault_files
          # HTTP now, not TCP. The old comment was right about the cause and
          # wrong about the cure: ALLOWED_HOSTS does reject the pod IP kubelet
          # sends by default, but the fix is to send a real Host header, not to
          # give up on asking the application anything. A TCP check passes on a
          # Daphne that has lost its database and answers 500 to every request.
          #
          # Two different endpoints, deliberately — see the app repo's
          # apps/core/health.py.
          #
          # readiness → /readyz, which round-trips Postgres and Redis and answers
          # 503 when either is down. Failing pulls the pod out of the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
              httpHeaders:
                - name: Host
                  value: nubi.duarte-correia.pt
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          # liveness → /healthz, which touches NOTHING external. This must never
          # be pointed at /readyz: a Postgres blip would then restart the pod,
          # turning a recoverable dependency failure into a crash loop that
          # outlives it — and with one replica and an RWO volume, that is the
          # whole site down rather than degraded.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: nubi.duarte-correia.pt
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              # Headroom for WeasyPrint: a certificate preview renders a PDF inside
              # the request (certificates/api/views.py), and Pango/Cairo allocate
              # well above idle. Idle is ~200Mi.
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

        # ── Celery worker ──────────────────────────────────────────────────────
        # Newsletter dispatch, certificate PDF generation, contact-form mail,
        # Drive sync. Same image, different entrypoint.
        - name: worker
          image: hydrodog11/biohub-up:latest
          imagePullPolicy: Always
          command: ["sh", "-lc", "exec celery -A config worker -l info --concurrency 2"]
          envFrom:
            - configMapRef:
                name: nubiup-env
            - secretRef:
                name: nubiup-app-secret
            - secretRef:
                name: nubiup-db-secret
            # AFTER the ConfigMap, deliberately: later envFrom entries win, so a
            # key that ever reappears in the ConfigMap cannot shadow the
            # credentialed URL. Carries the four redis:// URLs.
            - secretRef:
                name: nubiup-redis-secret
            # Optional for the same reason as on `web` above — see that comment.
            - secretRef:
                name: nubiup-drive-secret
                optional: true
          volumeMounts:
            # Read: newsletter attachments composed into outgoing mail.
            - name: media
              mountPath: /app/media
            # WRITE: every generated certificate PDF lands here, and web streams it
            # back out on download. Same volume, by design.
            - name: vault
              mountPath: /app/vault_files
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              # WeasyPrint again, and here in a batch: a campaign renders one PDF
              # per recipient, two in flight at concurrency 2.
              memory: 1536Mi
              ephemeral-storage: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

        # ── Media server ───────────────────────────────────────────────────────
        # Serves /media/ off the volume. Read-only, and the vault is deliberately
        # absent — do not add it.
        - name: media
          # nginxinc/nginx-unprivileged, NOT stock nginx:alpine. Stock starts its
          # master as root and needs CHOWN/SETUID/SETGID/DAC_OVERRIDE to drop to
          # the nginx user and write /var/cache/nginx and /var/run — all of which
          # `capabilities.drop: ["ALL"]` below takes away, so it died in
          # CrashLoopBackOff on the first deploy. Because the three containers
          # share one pod, that took the whole site down: a pod is Ready only when
          # every container is, so nubiup-web had no endpoints, and nubiup-next's
          # SSR fetches failed with `connect EPERM` — Cilium's answer for a
          # Service with no backends — while Django itself was serving 200s.
          #
          # This image is uid 101 with no root phase and already listens on 8080,
          # which is the port this ConfigMap and the Service were written for.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: media
              mountPath: /app/media
              readOnly: true
          # TCP, not HTTP: every path here answers 404 (catch-all) or 403 (/media/
          # with autoindex off), and httpGet counts only 2xx/3xx as success.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 256Mi
          # The same context as the other three, except the uid: 101 is this
          # image's own nginx user, which owns /var/cache/nginx and /tmp inside
          # it. Forcing 1000 here would reintroduce the crash from the other
          # direction — the dirs nginx writes would not be his.
          #
          # Reading the media volume still works at uid 101 because `fsGroup:
          # 1000` on the pod adds gid 1000 as a supplementary group to every
          # container, and Django writes uploads group-readable.
          #
          # VERIFY: confirm an uploaded image actually renders on a public page.
          # This container is how every CMS image reaches the site, and a 403 on
          # /media/ would look like a broken page rather than a permissions bug.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              # nginx binds 8080, so it needs no privileged port.
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: nubiup-media
        - name: vault
          persistentVolumeClaim:
            claimName: nubiup-vault
        - name: nginx-config
          configMap:
            name: nubiup-media-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nubiup-web
  namespace: rafael-homelab
spec:
  selector:
    app: nubiup-web
  ports:
    - port: 8000
      targetPort: 8000
---
# Same pod, the nginx container's port. Split out as its own Service so the
# HTTPRoute can send /media/ here without going through Django.
apiVersion: v1
kind: Service
metadata:
  name: nubiup-media
  namespace: rafael-homelab
spec:
  selector:
    app: nubiup-web
  ports:
    - port: 80
      targetPort: 8080

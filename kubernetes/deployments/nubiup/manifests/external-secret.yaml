# Pulls Nubi UP's secrets from Bitwarden. Create these Bitwarden items first —
# the app will not start without them:
#   rafael-nubiup-django-secret-key → Django SECRET_KEY (long random string)
#   rafael-nubiup-db-password       → Postgres password for the `nubiup` role
#
# Only actual secrets live in Bitwarden. The Postgres *role name* is a literal in
# the template below, because it has to match postgres-cluster.yaml and is not a
# credential — see the comment there.
#
# Produces two Secrets:
#   nubiup-app-secret → DJANGO_SECRET_KEY
#   nubiup-db-secret  → username, password (CNPG bootstrap reads this too)
#
# Email credentials are commented out below, ready to switch on. Until there is
# a mailbox, EMAIL_HOST stays unset and Django uses the console backend. To
# enable: create rafael-nubiup-email-host-user and -password in Bitwarden FIRST,
# then uncomment the two entries in nubiup-app-secret and the email block in
# configmap.yaml. web, worker, beat and migrate all envFrom nubiup-app-secret
# already, so no Deployment needs editing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-app-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-app-secret
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: rafael-nubiup-django-secret-key
    # Uncomment only once both Bitwarden secrets exist — a missing key fails the
    # whole ExternalSecret, DJANGO_SECRET_KEY included. See configmap.yaml.
    # - secretKey: EMAIL_HOST_USER
    #   remoteRef:
    #     key: rafael-nubiup-email-host-user
    # - secretKey: EMAIL_HOST_PASSWORD
    #   remoteRef:
    #     key: rafael-nubiup-email-host-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-db-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-db-secret
    creationPolicy: Owner
    template:
      data:
        # The role name is a LITERAL, not a secret. It must equal
        # postgres-cluster.yaml's `bootstrap.initdb.owner`, which is plaintext in
        # this repo anyway, and it names a database role rather than authenticating
        # anything. Sourcing it from Bitwarden only created a way to get it wrong: a
        # random value there yields
        #   password authentication failed for user "dC0j4Qak..."
        # which reads like a password problem and is not one.
        #
        # CNPG requires exactly `username` / `password` on its bootstrap and
        # superuser secrets; Django wants POSTGRES_USER / POSTGRES_PASSWORD. Emitting
        # both spellings lets every workload pull its whole environment with envFrom
        # instead of hand-wiring secretKeyRefs in four places.
        username: "nubiup"
        password: "{{ .password }}"
        POSTGRES_USER: "nubiup"
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rafael-nubiup-db-password
---
# Redis is now password-protected (see redis.yaml for why), so the four
# connection URLs carry a credential and cannot live in the ConfigMap any more.
#
# They are TEMPLATED here rather than assembled in the app, so there is exactly
# one place the password appears and no chance of three of the four being right —
# which is the shape of the bug the CACHE_REDIS_URL comment in configmap.yaml
# describes. Same four logical DBs as before: /0 broker, /1 results, /2 channels,
# /3 the Django cache.
#
# Create the Bitwarden item first:
#   rafael-nubiup-redis-password → a long random string
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-redis-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-redis-secret
    creationPolicy: Owner
    template:
      data:
        # Consumed by redis.yaml itself, to set --requirepass.
        password: "{{ .password }}"
        # Consumed by web, worker, beat and the migrate initContainer via envFrom.
        CELERY_BROKER_URL: "redis://:{{ .password }}@nubiup-redis:6379/0"
        CELERY_RESULT_BACKEND: "redis://:{{ .password }}@nubiup-redis:6379/1"
        CHANNELS_REDIS_URL: "redis://:{{ .password }}@nubiup-redis:6379/2"
        CACHE_REDIS_URL: "redis://:{{ .password }}@nubiup-redis:6379/3"
  data:
    - secretKey: password
      remoteRef:
        key: rafael-nubiup-redis-password
---
# Google Drive, for the public Resources page.
#
# apps/documents/drive_auth.py reads this from the environment and NOTHING in
# this namespace was providing it, so the Drive sync has never run in the
# cluster — and it fails as "the sync does nothing" rather than as a
# configuration error, which is why it went unnoticed.
#
# A secret, never the ConfigMap: it is a service-account private key. The scope
# is Drive read-only (DRIVE_SCOPE in drive_auth.py), which is correct — it only
# ever mirrors a shared folder.
#
# Create the Bitwarden item first:
#   rafael-nubiup-drive-service-account-b64 → base64 of the service account JSON, one line:
#     base64 -w0 drive-sa.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-drive-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-drive-secret
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_B64
      remoteRef:
        key: rafael-nubiup-drive-service-account-b64
---
# Docker Hub pull credentials.
#
# This used to be created by hand (README, "Image pull credentials"), which meant
# a namespace recreation silently lost it and every workload sat in
# ImagePullBackOff with an auth error that reads like wrong credentials rather
# than absent ones. Sourcing it from Bitwarden like everything else makes the
# namespace reproducible from git.
#
# Create the Bitwarden items first:
#   rafael-nubiup-dockerhub-username → the Docker Hub account name
#   rafael-nubiup-dockerhub-token    → a read-only access token, NOT the password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-dockerhub
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-dockerhub
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: rafael-nubiup-dockerhub-username
    - secretKey: token
      remoteRef:
        key: rafael-nubiup-dockerhub-token
---
# Garage credentials for the Postgres backup (postgres-cluster.yaml).
#
# Create the Bitwarden items first, from a Garage key scoped to the
# porto-k8s-backup bucket — not an admin key:
#   rafael-nubiup-backup-s3-key-id
#   rafael-nubiup-backup-s3-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-backup-s3-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-backup-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: rafael-nubiup-backup-s3-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: rafael-nubiup-backup-s3-secret

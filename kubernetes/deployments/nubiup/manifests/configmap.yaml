# Non-secret environment shared by web, worker, beat and the migrate job. Kept in
# one place because a mismatch between them is a silent bug: the worker rendering
# email links off a different PUBLIC_SITE_URL than the web pod, for example.
#
# The public site (nubiup-next) deliberately does NOT consume this. It needs none
# of it, and the database password has no business in the environment of an
# internet-facing Node server — see next-deployment.yaml, which sets its five
# variables inline.
#
# THE HOSTNAME APPEARS HERE AND IN THREE OTHER FILES (gateway, certificate,
# tunnelbinding). When the real domain is bought, see README.md — it lists every
# place that has to change together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nubiup-env
  namespace: rafael-homelab
data:
  DJANGO_SETTINGS_MODULE: config.settings.prod
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"

  # Django rejects any Host header not listed here, so it must include every
  # hostname the gateway and tunnel terminate.
  DJANGO_ALLOWED_HOSTS: "nubi.duarte-correia.pt"
  CSRF_TRUSTED_ORIGINS: "https://nubi.duarte-correia.pt"

  # Absolute URL used to build links inside outgoing email (unsubscribe, confirm,
  # the email logo). apps/newsletter/url_utils.py refuses to send over real SMTP
  # while this points at localhost, so it must be the public origin.
  PUBLIC_SITE_URL: "https://nubi.duarte-correia.pt"
  WAGTAIL_BASE_URL: "https://nubi.duarte-correia.pt"

  # The Wagtail Site row, written by create_initial_pages on every deploy. Without
  # these it would reset to localhost:80 each sync and Wagtail would start building
  # localhost URLs in page.full_url and the sitemap.
  WAGTAIL_SITE_HOSTNAME: "nubi.duarte-correia.pt"
  WAGTAIL_SITE_PORT: "443"

  # Where the CMS sends an editor who clicks "Preview". The public site fetches
  # the draft back from /api/v2/preview/<token>/, so Django never calls this —
  # it is a BROWSER redirect target and must therefore be the public origin, not
  # a Service name. Unset, it defaults to http://localhost:3000/preview and
  # every editor who previews a page lands on their own machine.
  FRONTEND_PREVIEW_URL: "https://nubi.duarte-correia.pt/preview"

  POSTGRES_DB: nubiup
  POSTGRES_HOST: nubiup-postgres-rw
  POSTGRES_PORT: "5432"

  # The four Redis URLs are NOT here any more. Redis now requires a password
  # (redis.yaml), so the URLs carry a credential and live in the
  # nubiup-redis-secret ExternalSecret, which templates all four from one value.
  #
  # They are still the same four isolated logical DBs — /0 broker, /1 results,
  # /2 channels, /3 the Django cache — and CACHE_REDIS_URL is still required:
  # config/settings/prod.py refuses to boot without it, because its absence used
  # to be silent. base.py defaults it to a docker-compose service name that
  # resolves to nothing here, and a broken Django cache does not raise — it
  # renders the members graph empty forever.
  #
  # envFrom order matters: nubiup-redis-secret must come AFTER this ConfigMap in
  # every workload's envFrom list, or a stale key here would shadow it. Nothing
  # is left here to shadow, which is the safer arrangement.

  # EMAIL_HOST is deliberately unset: config/settings/base.py selects the SMTP
  # backend only when it is present, so mail goes to the pod log until there is a
  # real mailbox on the real domain. Nothing else is gated on it.

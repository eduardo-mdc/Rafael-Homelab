# Non-secret environment shared by web, worker, beat and the migrate job. Kept in
# one place because a mismatch between them is a silent bug: the worker rendering
# email links off a different PUBLIC_SITE_URL than the web pod, for example.
#
# The public site (nubiup-next) deliberately does NOT consume this. It needs none
# of it, and the database password has no business in the environment of an
# internet-facing Node server — see next-deployment.yaml, which sets its five
# variables inline.
#
# THE HOSTNAME APPEARS HERE AND IN THREE OTHER FILES (gateway, certificate,
# tunnelbinding). When the real domain is bought, see README.md — it lists every
# place that has to change together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nubiup-env
  namespace: rafael-homelab
data:
  DJANGO_SETTINGS_MODULE: config.settings.prod
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"

  # Django rejects any Host header not listed here, so it must include every
  # hostname the gateway and tunnel terminate. nubiup-proxy passes the client's
  # Host through untouched, so adding a front door did not add a name here.
  DJANGO_ALLOWED_HOSTS: "nubi.duarte-correia.pt"
  CSRF_TRUSTED_ORIGINS: "https://nubi.duarte-correia.pt"

  # How many proxies sit between the client and Django, for DRF's throttle
  # identity (config/settings/prod.py reads this into NUM_PROXIES).
  #
  # TWO, since nubiup-proxy became the front door, and this is arithmetic rather
  # than the guess it replaces. DRF takes `addrs[-min(NUM_PROXIES, len(addrs))]`
  # from X-Forwarded-For, and both paths into the cluster now build a two-entry
  # chain:
  #
  #   LAN     client → Envoy (appends client) → nginx (appends Envoy's address)
  #   tunnel  client → Cloudflare/cloudflared → nginx (appends its caller's)
  #
  # so Django sees "<client>, <last hop>" and the client is at index -2.
  # Measured against the real nginx config rather than assumed: at 1, DRF
  # resolves every request to the front door's own pod IP, which is one shared
  # throttle bucket for the entire internet on the four anonymous write
  # endpoints.
  #
  # VERIFY on first sync — only the Envoy half is inferred. Confirm the gateway
  # appends to X-Forwarded-For rather than replacing it. If a LAN request and a
  # tunnel request disagree about the client, this is the value to look at.
  TRUSTED_PROXY_HOPS: "2"

  # Absolute URL used to build links inside outgoing email (unsubscribe, confirm,
  # the email logo). apps/newsletter/url_utils.py refuses to send over real SMTP
  # while this points at localhost, so it must be the public origin.
  PUBLIC_SITE_URL: "https://nubi.duarte-correia.pt"
  WAGTAIL_BASE_URL: "https://nubi.duarte-correia.pt"

  # The Wagtail Site row, written by create_initial_pages on every deploy. Without
  # these it would reset to localhost:80 each sync and Wagtail would start building
  # localhost URLs in page.full_url and the sitemap.
  WAGTAIL_SITE_HOSTNAME: "nubi.duarte-correia.pt"
  WAGTAIL_SITE_PORT: "443"

  # Where the CMS sends an editor who clicks "Preview". The public site fetches
  # the draft back from /api/v2/preview/<token>/, so Django never calls this —
  # it is a BROWSER redirect target and must therefore be the public origin, not
  # a Service name. Unset, it defaults to http://localhost:3000/preview and
  # every editor who previews a page lands on their own machine.
  FRONTEND_PREVIEW_URL: "https://nubi.duarte-correia.pt/preview"

  POSTGRES_DB: nubiup
  POSTGRES_HOST: nubiup-postgres-rw
  POSTGRES_PORT: "5432"

  # The four Redis URLs are NOT here any more. Redis now requires a password
  # (redis.yaml), so the URLs carry a credential and live in the
  # nubiup-redis-secret ExternalSecret, which templates all four from one value.
  #
  # They are still the same four isolated logical DBs — /0 broker, /1 results,
  # /2 channels, /3 the Django cache — and CACHE_REDIS_URL is still required:
  # config/settings/prod.py refuses to boot without it, because its absence used
  # to be silent. base.py defaults it to a docker-compose service name that
  # resolves to nothing here, and a broken Django cache does not raise — it
  # renders the members graph empty forever.
  #
  # envFrom order matters: nubiup-redis-secret must come AFTER this ConfigMap in
  # every workload's envFrom list, or a stale key here would shadow it. Nothing
  # is left here to shadow, which is the safer arrangement.

  # ── Email — OFF until there is a mailbox ────────────────────────────────────
  #
  # EMAIL_HOST unset means config/settings/base.py picks the console backend:
  # every message is written to the pod log and nothing is delivered. Password
  # reset, the contact form, newsletter sends and certificate delivery all run,
  # and all land in `kubectl logs` instead of an inbox.
  #
  # TO TURN IT ON, two edits and nothing else — every Django workload already
  # loads this ConfigMap and nubiup-app-secret, so no Deployment changes:
  #   1. Uncomment and fill the block below.
  #   2. Uncomment the two EMAIL_HOST_* entries in external-secret.yaml, after
  #      creating the matching Bitwarden secrets. Not before: an ExternalSecret
  #      naming a key that does not exist fails to sync as a whole, which takes
  #      DJANGO_SECRET_KEY down with it.
  #
  # DEFAULT_FROM_EMAIL must be an address on a domain whose SPF/DKIM the mail
  # provider is authorised for, or real sends land in spam. Until it is set it
  # falls back to a PLACEHOLDER address in base.py, which is harmless only while
  # the console backend is in use.
  #
  # EMAIL_HOST: "smtp.example.com"
  # EMAIL_PORT: "587"
  # EMAIL_USE_TLS: "true"
  # DEFAULT_FROM_EMAIL: "Nubi UP <hello@nubi.pt>"
  # NEWSLETTER_REPLY_TO: ""
  #
  # One more thing that is NOT an environment variable: create_initial_pages
  # seeds the ContactPage with PLACEHOLDER-EMAIL@example.com as both to- and
  # from-address. Those are database rows. Change them in the CMS, or the
  # contact form still mails nowhere after all of the above is done.

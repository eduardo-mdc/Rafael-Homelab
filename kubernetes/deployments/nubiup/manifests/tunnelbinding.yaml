# Public access over the shared Cloudflare tunnel.
#
# This is how the PUBLIC reaches the site. On the LAN, Pi-hole resolves the same
# hostname to the cluster ingress and traffic goes through nubiup-gateway
# instead; both paths end up at the same front door, which is the point.
#
# WHY IT TARGETS nubiup-proxy. Tunnel traffic does not pass through the Gateway,
# so whatever this points at is the whole site as far as the internet is
# concerned. That used to be `nubiup-web:8000`, which was right while Django
# rendered the public pages and became wrong when Next took them over.
#
# The obvious repair — send tunnel traffic through the Gateway too — needs the
# Service that Envoy Gateway provisions, whose name carries a generated hash and
# so has to be read out of a running cluster. This file carried a REPLACE-ME
# placeholder for exactly that reason, and a placeholder is not a deployment.
#
# So the split moved into a workload with an ordinary, predictable name, and this
# targets it the way every other TunnelBinding in this repo targets its app —
# plain http, a Service DNS name, no hash to look up. See portfolio, cladewright,
# umami and examples/tunnel-binding.yaml; proxy.yaml has the full reasoning.
#
# THE WHOLE SITE COMES THROUGH HERE, including /cms/ and /staff/. Nubi UP has
# staff who edit content from outside the building, so an admin surface that only
# answers on the LAN is one most of them cannot use. Everything sensitive behind
# it is authenticated regardless of which backend answers: /cms/ is Wagtail
# login, /staff/ and /api/v2/staff/ are gated by StaffRequiredMixin and DRF
# permission classes, and django-axes rate-limits the login itself.
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: nubiup
  namespace: rafael-homelab
subjects:
  - name: nubiup-proxy
    spec:
      fqdn: nubi.duarte-correia.pt
      # Plain http, unlike the previous https-to-the-gateway shape: this hop
      # never leaves the cluster, and TLS already terminated at Cloudflare's
      # edge. Nothing here is reachable from outside the cluster network.
      protocol: http
      http2Origin: true
      noTlsVerify: true
      target: http://nubiup-proxy.rafael-homelab.svc.cluster.local:80
tunnelRef:
  kind: ClusterTunnel
  name: porto-cluster-tunnel

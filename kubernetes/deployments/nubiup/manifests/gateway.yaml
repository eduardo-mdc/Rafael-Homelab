apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nubiup-gateway
  namespace: rafael-homelab
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "nubi.duarte-correia.pt"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nubiup-tls-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nubiup-http
  namespace: rafael-homelab
spec:
  parentRefs:
    - name: nubiup-gateway
      namespace: rafael-homelab
      sectionName: https
  hostnames:
    - "nubi.duarte-correia.pt"
  # ONE RULE, ON PURPOSE. The path split lives in nubiup-proxy, not here.
  #
  # This used to carry the whole split — /_next/, /api/forms/ and /en/ + /pt/ to
  # nubiup-next, /media/ to nubiup-media, everything else to Django. That worked,
  # and it could only ever work for LAN traffic: the Cloudflare tunnel does not
  # enter through the Gateway, so a split that lives only here is a split the
  # public internet never sees. proxy.yaml has the full reasoning; the ConfigMap
  # there is where those five rules now live, one for one.
  #
  # Sending both paths through one front door means there is a single routing
  # table to keep correct instead of two that have to agree — the same reason
  # portfolio's HTTPRoute is also a single PathPrefix: / to its frontend.
  #
  # Host header: preserved as sent, which is load-bearing rather than hygiene.
  # nubiup-proxy passes it on and nubiup-next forwards it to Django, where
  # Wagtail resolves the site from it — and when Site.find_for_request matches
  # nothing the pages API answers with an EMPTY 200 rather than an error, so a
  # rewritten Host renders a blank site that reads as a routing bug and is not
  # one. Do not add a URLRewrite filter here.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nubiup-proxy
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nubiup-backend-policy
  namespace: rafael-homelab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nubiup-http
  timeout:
    http:
      # The staff SPA holds a notification websocket open for as long as someone
      # has the tab open — a work tool, so that is a whole working day. A default
      # idle cap would drop it repeatedly; the client treats an unexpected close as
      # a reconnect, so the symptom would be churn rather than an obvious failure.
      connectionIdleTimeout: 3600s
      maxConnectionDuration: 3600s
      # Ordinary requests stay bounded. 120s rather than the default because a
      # certificate preview renders a PDF with WeasyPrint inside the request.
      requestTimeout: 120s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: nubiup-client-policy
  namespace: rafael-homelab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nubiup-gateway
  timeout:
    http:
      idleTimeout: 3600s

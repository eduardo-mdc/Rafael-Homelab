apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nubiup-gateway
  namespace: rafael-homelab
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "nubi.duarte-correia.pt"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nubiup-tls-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nubiup-http
  namespace: rafael-homelab
spec:
  parentRefs:
    - name: nubiup-gateway
      namespace: rafael-homelab
      sectionName: https
  hostnames:
    - "nubi.duarte-correia.pt"
  # THE PUBLIC SITE IS NOT DJANGO ANY MORE.
  #
  # Django serves the CMS, the staff SPA and the API; a Next server (nubiup-next)
  # renders every public page against that API. These rules are the same split
  # the app repo's nginx/default.conf makes for docker-compose, and the two must
  # agree — that file is the readable reference for why each one exists.
  #
  # Rule ORDER is irrelevant here: Gateway API matches the LONGEST prefix, not
  # the first listed. (nginx matches in file order, which is why the same split
  # is written most-specific-first over there.) They are ordered most-specific
  # first anyway, so the two files read the same way.
  #
  # Host header: preserved as sent, which is load-bearing rather than hygiene.
  # nubiup-next forwards it to Django, and Wagtail resolves the site from it —
  # when Site.find_for_request matches nothing the pages API answers with an
  # EMPTY 200 rather than an error, so a rewritten Host renders a blank site that
  # reads as a routing bug and is not one. Do not add a URLRewrite filter here.
  rules:
    # ── Next ────────────────────────────────────────────────────────────────
    # The public site's build output. Content-hashed and served with Next's own
    # immutable cache headers, which are passed through untouched.
    - matches:
        - path:
            type: PathPrefix
            value: /_next/
      backendRefs:
        - name: nubiup-next
          port: 3000

    # Public form posts. The route handlers live in the Next app and proxy to
    # Django server-side against an allow-list of four paths. This must be more
    # specific than the catch-all, or every form post lands on a Django URL that
    # does not exist. Note Django's own API stays at /api/v2/ and is NOT here.
    - matches:
        - path:
            type: PathPrefix
            value: /api/forms/
      backendRefs:
        - name: nubiup-next
          port: 3000

    # Every public page. Wagtail's locale trees keep the /en/ and /pt/ prefixes,
    # so these two are the whole public site. The bare / is deliberately absent:
    # it falls to Django below, which redirects to the visitor's language.
    - matches:
        - path:
            type: PathPrefix
            value: /en/
        - path:
            type: PathPrefix
            value: /pt/
      backendRefs:
        - name: nubiup-next
          port: 3000

    # ── nginx ───────────────────────────────────────────────────────────────
    # /media/ off the read-only nginx container in the app pod. Wagtail uploads
    # and renditions only — the vault is deliberately not mounted there.
    - matches:
        - path:
            type: PathPrefix
            value: /media/
      backendRefs:
        - name: nubiup-media
          port: 80

    # ── Django ──────────────────────────────────────────────────────────────
    # Everything left: /cms/, /staff/ (the SPA shell and its /static/ bundle via
    # WhiteNoise), /api/v2/, /documents/, /robots.txt, /healthz, the
    # ws/notifications/ websocket, and the bare / language redirect.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nubiup-web
          port: 8000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nubiup-backend-policy
  namespace: rafael-homelab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nubiup-http
  timeout:
    http:
      # The staff SPA holds a notification websocket open for as long as someone
      # has the tab open — a work tool, so that is a whole working day. A default
      # idle cap would drop it repeatedly; the client treats an unexpected close as
      # a reconnect, so the symptom would be churn rather than an obvious failure.
      connectionIdleTimeout: 3600s
      maxConnectionDuration: 3600s
      # Ordinary requests stay bounded. 120s rather than the default because a
      # certificate preview renders a PDF with WeasyPrint inside the request.
      requestTimeout: 120s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: nubiup-client-policy
  namespace: rafael-homelab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nubiup-gateway
  timeout:
    http:
      idleTimeout: 3600s

# The first CMS account, created from git.
#
# WHY THIS FILE EXISTS. `createsuperuser` normally wants a shell in the pod, and
# this cluster offers neither: Argo CD ships with exec DISABLED (the pod view has
# Summary, Events and Logs, no Terminal) and turning it on needs `exec.enabled`
# in argocd-cm plus an RBAC rule — i.e. the cluster access this exists to work
# around. Rancher's shell would do, when there is a token for it.
#
# So the account is created by a Job that runs our own image with the web pod's
# environment. The password never touches git: it comes from Bitwarden, like
# every other credential here.
#
# ── TO USE ─────────────────────────────────────────────────────────────────────
#  1. In Bitwarden Secrets Manager, in the SAME project as the other items
#     (external-secret.yaml names it), create:
#       rafael-nubiup-admin-password → a long password you will actually type
#  2. Set ADMIN_USERNAME and ADMIN_EMAIL below to what you want, and commit.
#  3. Let Argo sync. The Job runs once and should end Succeeded; its log says
#     "created superuser <name>".
#  4. Log in at https://nubi.duarte-correia.pt/cms/ and /staff/.
#  5. THEN DELETE THIS FILE and commit. Leaving it costs nothing while the Job
#     object exists, but see "re-running" below for why it should not outlive its
#     purpose.
#
# ── RE-RUNNING ─────────────────────────────────────────────────────────────────
# A Job is immutable and this one is idempotent: it creates the account, or
# updates the password of an existing one, then exits. Argo will not re-run it
# while the completed Job exists. To run it again — a forgotten password, say —
# change the password in Bitwarden, then either delete the Job in the Argo UI and
# Sync, or bump the `-1` suffix in its name and commit.
#
# There is deliberately NO ttlSecondsAfterFinished. With `prune: true` and a Job
# still in git, a TTL that deletes the finished Job would have Argo recreate it on
# the next sync, which would reset the password on a loop.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubiup-admin-secret
  namespace: rafael-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: nubiup-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: rafael-nubiup-admin-password
---
apiVersion: batch/v1
kind: Job
metadata:
  # -2, because -1 already ran and a Job is immutable. Bumping the suffix is how
  # this gets to run again; the completed -1 stays until this file is deleted.
  name: nubiup-create-superuser-2
  namespace: rafael-homelab
spec:
  # Three attempts, then stop and stay Failed where it can be seen. The usual
  # cause of a failure here is the Bitwarden item not existing yet, and retrying
  # forever would bury that.
  backoffLimit: 3
  template:
    metadata:
      labels:
        # NOT `app: nubiup-web`. That label is the selector of the nubiup-web and
        # nubiup-media Services, so wearing it would put this pod into the
        # Services' endpoints and send live site traffic to a one-shot Job.
        #
        # `nubiup-job` is listed in networkpolicy.yaml instead, which is what lets
        # this reach Postgres at all.
        app: nubiup-job
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: nubiup-dockerhub
      securityContext:
        fsGroup: 1000
      containers:
        - name: createsuperuser
          image: hydrodog11/biohub-up:latest
          imagePullPolicy: Always
          # `manage.py createsuperuser --noinput` would fail outright when the
          # username already exists, which makes a re-run an error rather than a
          # no-op. This does the same job idempotently: create, or take over the
          # existing account and set its password.
          #
          # set_password() bypasses Django's password validators, so the strength
          # of this account rests entirely on what is in Bitwarden. Make it long.
          #
          # It also does two things the first version did not, because the first
          # version created the account and the login still said the credentials
          # did not match:
          #
          #   1. STRIPS the password. Bitwarden keeps a value verbatim, so a
          #      trailing newline from a paste is part of the secret and gets
          #      hashed with it — and then a password typed by hand can never
          #      match. Stripping makes the stored value and the typed one agree.
          #      Leading/trailing whitespace in a password buys nothing anyway.
          #   2. CLEARS the django-axes lockout for this username. axes blocks by
          #      username after 5 failures for an hour (AXES_FAILURE_LIMIT /
          #      AXES_COOLOFF_TIME), and a locked account refuses the CORRECT
          #      password with the same "did not match" message. Attempts made
          #      while the account did not exist still count. Normally this is
          #      `manage.py axes_reset_username`, which needs the shell this Job
          #      exists to replace.
          #
          # The diagnostics it prints are deliberately not the password: a length
          # and a hash prefix. Check the paste against it locally with
          #   printf '%s' '<what you pasted>' | sha256sum
          # and compare the first 12 characters.
          command:
            - sh
            - -lc
            - |
              python - <<'PY'
              import hashlib
              import os

              import django

              django.setup()  # DJANGO_SETTINGS_MODULE comes from the ConfigMap

              from django.contrib.auth import get_user_model
              from django.core.management import call_command

              User = get_user_model()
              username = os.environ["ADMIN_USERNAME"]
              raw = os.environ["ADMIN_PASSWORD"]
              password = raw.strip()

              print(f"secret: len(raw)={len(raw)} len(stripped)={len(password)}")
              if raw != password:
                  print("secret: HAD surrounding whitespace — that was the login failure")
              print(f"secret: sha256(stripped)[:12]={hashlib.sha256(password.encode()).hexdigest()[:12]}")

              user, created = User.objects.get_or_create(
                  username=username,
                  defaults={"email": os.environ.get("ADMIN_EMAIL", "")},
              )
              user.is_staff = True
              user.is_superuser = True
              user.is_active = True
              user.set_password(password)
              user.save()
              print(f"user: {'created' if created else 'updated'} {username} "
                    f"active={user.is_active} staff={user.is_staff} super={user.is_superuser}")

              # How many failures axes had recorded, before clearing them. Over
              # AXES_FAILURE_LIMIT and the account was locked, whatever was typed.
              try:
                  from axes.models import AccessAttempt

                  attempts = AccessAttempt.objects.filter(username=username)
                  print(f"axes: {attempts.count()} attempt row(s), "
                        f"failures={[a.failures_since_start for a in attempts]}")
              except Exception as exc:  # axes internals are not a contract
                  print(f"axes: could not read attempts ({exc})")

              call_command("axes_reset_username", username)
              print(f"axes: lockout cleared for {username}")
              PY
          envFrom:
            # The same environment the web container gets: settings module,
            # ALLOWED_HOSTS, the database credentials and the Redis URLs.
            - configMapRef:
                name: nubiup-env
            - secretRef:
                name: nubiup-app-secret
            - secretRef:
                name: nubiup-db-secret
            - secretRef:
                name: nubiup-redis-secret
            - secretRef:
                name: nubiup-admin-secret
          env:
            # The username is what you type at the login form. Change it if you
            # want something else; it is not a secret and not a credential on its
            # own — django-axes locks out by username, so it is the thing an
            # attacker needs to guess to lock you out, not to get in.
            - name: ADMIN_USERNAME
              value: "rafael"
            # Optional, and left empty on purpose: this repo is shared, and
            # Django does not need an address to create the account. Wagtail will
            # ask for one the first time it wants to email you.
            - name: ADMIN_EMAIL
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
